name: Aperture CI & WCAG Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-build:
    name: Lint, Vitest WCAG Audit & Monorepo Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build lens-a11y Library (ESM + CJS + IIFE + Extension)
        run: pnpm --filter lens-a11y build

      - name: Run Vitest WCAG Contrast & Auditor Suite
        run: pnpm --filter lens-a11y test

      - name: Build Next.js 15 Showcase Website
        run: pnpm --filter web build