name: Aperture CI & WCAG Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-audit:
    name: Build, Test & Verify Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: npm install -g pnpm@9

      - name: Install Workspace Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 1. Build Core Optical Engine (lens-a11y)
        run: pnpm --filter lens-a11y build

      - name: 2. Run WCAG Auditor & Matrix Unit Tests
        run: pnpm --filter lens-a11y test

      - name: 3. Typecheck Core Library
        run: pnpm --filter lens-a11y lint

      - name: 4. Build Next.js Showcase (apps/web)
        run: pnpm --filter web build